name: Pull request validation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore CodexGithubRouter.slnx

      - name: Release build
        run: dotnet build CodexGithubRouter.slnx -c Release --no-restore --nologo

      - name: xUnit unit and sandbox integration tests
        run: dotnet test CodexGithubRouter.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx" --nologo

      - name: Validate diff whitespace
        shell: bash
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/**/*.trx'
          if-no-files-found: ignore

  package-smoke:
    name: Package smoke validation
    runs-on: ubuntu-latest
    needs: validate
    env:
      CI_PACKAGE_VERSION: 0.0.2-ci.${{ github.run_id }}.${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Pack Release tool
        run: dotnet pack src/CodexGithubRouter/CodexGithubRouter.csproj -c Release --nologo -p:PackageVersion="$CI_PACKAGE_VERSION" -o "$RUNNER_TEMP/cgr-nupkg"

      - name: Install package into temporary tool path
        run: |
          cat > "$RUNNER_TEMP/nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="ci-package" value="$RUNNER_TEMP/cgr-nupkg" />
            </packageSources>
          </configuration>
          EOF
          dotnet tool install --tool-path "$RUNNER_TEMP/cgr-tool" --configfile "$RUNNER_TEMP/nuget.config" codex-github-router --version "$CI_PACKAGE_VERSION"

      - name: Start packaged CLI
        run: "$RUNNER_TEMP/cgr-tool/cgr" --help
